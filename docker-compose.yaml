version: '3.8'

services:
  # БД для сервиса с картами
  db_card:
    container_name: db_card
    environment:
      MONGO_INITDB_ROOT_USERNAME_CARD: ${MONGO_INITDB_ROOT_USERNAME_CARD}
      MONGO_INITDB_ROOT_PASSWORD_CARD: ${MONGO_INITDB_ROOT_PASSWORD_CARD}
    image: mongo:5.0.25
    command: mongod --port ${MONGO_INITDB_PORT_CARD}
    ports:
      - ${MONGO_INITDB_PORT_CARD}:${MONGO_INITDB_PORT_CARD}
    volumes:
      - db_card_vol:/data/db
    networks:
      - server_net

  # Сервис для управления заметками
  card:
    container_name: card 
    build: ./card
    depends_on:
      - db_card 
    networks:
      - server_net
    ports:
      - ${CARD_PORT}:${CARD_PORT}
    environment:
      CARD_PORT: ${CARD_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_HOST_CARD: ${MONGO_INITDB_HOST_CARD}
      MONGO_INITDB_PORT_CARD: ${MONGO_INITDB_PORT_CARD}
      MONGO_INITDB_ROOT_USERNAME_CARD: ${MONGO_INITDB_ROOT_USERNAME_CARD}
      MONGO_INITDB_ROOT_PASSWORD_CARD: ${MONGO_INITDB_ROOT_PASSWORD_CARD}

  # БД для корзины
  db_basket:
    container_name: db_basket
    environment:
      MONGO_INITDB_ROOT_USERNAME_BASKET: ${MONGO_INITDB_ROOT_USERNAME_BASKET}
      MONGO_INITDB_ROOT_PASSWORD_BASKET: ${MONGO_INITDB_ROOT_PASSWORD_BASKET}
    image: mongo:5.0.25
    command: mongod --port ${MONGO_INITDB_PORT_BASKET}
    ports:
      - ${MONGO_INITDB_PORT_BASKET}:${MONGO_INITDB_PORT_BASKET}
    volumes:
      - db_basket_vol:/data/db
    networks:
      - server_net

  # Сервис для корзины
  basket:
    container_name: basket
    build: ./basket
    depends_on:
      - db_basket
    networks:
      - server_net
    ports:
      - ${BASKET_PORT}:${BASKET_PORT}
    environment:
      BASKET_PORT: ${BASKET_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_HOST_BASKET: ${MONGO_INITDB_HOST_BASKET}
      MONGO_INITDB_PORT_BASKET: ${MONGO_INITDB_PORT_BASKET}
      MONGO_INITDB_ROOT_USERNAME_BASKET: ${MONGO_INITDB_ROOT_USERNAME_BASKET}
      MONGO_INITDB_ROOT_PASSWORD_BASKET: ${MONGO_INITDB_ROOT_PASSWORD_BASKET}

  # БД для сервиса управления пользователями
  db_user:
    container_name: db_user 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    image: postgres:latest
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - db_auth_voll:/var/lib/postgresql/data
    networks:
      - server_net

  # Сервис для управления пользователями
  user:
    container_name: user
    build: ./user
    depends_on:
      - db_user
    networks:
      - server_net
    ports:
      - ${AUTH_PORT}:${AUTH_PORT}
    environment:
      AUTH_PORT: ${AUTH_PORT}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PORT: 5432
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USE_SSL: ${POSTGRES_USE_SSL}

  # Zookeeper для Kafka (новый образ)
  zookeeper:
    image: wurstmeister/zookeeper:latest # Используем более новый образ
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_ADMINSERVER_ENABLED: "true"
      ZOOKEEPER_SERVER_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - server_net

  # Kafka (новый образ)
  kafka:
    image: confluentinc/cp-kafka:latest  # Используем официальный образ Confluent
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"    # Порты для Kafka
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_ADVERTISED_LISTENER: INSIDE://kafka:9093
      KAFKA_LISTENER_INTERNAL: INTERNAL://kafka:9093
      KAFKA_LISTENER_OUTSIDE: OUTSIDE://localhost:9092
      KAFKA_LISTENER_PORT: 9093
      KAFKA_LISTENER_INTER_BROKER: INTERNAL
      KAFKA_LISTENER_NAME_INTERNAL: INTERNAL
      KAFKA_LISTENER_NAME_OUTSIDE: OUTSIDE
      KAFKA_LISTENER_INTER_BROKER_PORT: 9093
      KAFKA_LISTENER_OUTSIDE_PORT: 9092
    volumes:
      - /tmp/broker-metadata:/var/lib/kafka/data
    expose:
      - "9093"         # Порт для внутренних нужд
    networks:
      - server_net

volumes:
  db_card_vol: {}
  db_auth_voll: {}
  db_basket_vol: {}

networks:
  server_net:
    driver: bridge
